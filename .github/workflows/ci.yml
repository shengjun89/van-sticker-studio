# CI：门禁工作流（草稿，未推，等过目）
#
# 门禁与 AGENTS.md 一致：lint、test、tsc、build 四项全绿才可合并。
# 触发：PR + 推 main（合并后主分支门禁再跑一次）。
# 分支保护（要求本工作流全绿才能合并）需维护者在仓库 Settings 里开，agent 开不了。
# 不在本次草稿内、后续 infra 项：PR 预览部署、视觉 harness、资产体积预算监控。

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22" # AGENTS.md 要求 Node >= 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Scan client build for secret markers
        shell: bash
        run: |
          if [[ -L dist || -L dist/client || ! -d dist || ! -d dist/client ]]; then
            printf '%s\n' 'Client secret marker scan failed.'
            exit 1
          fi
          if client_scan_symlink="$(find -P dist/client -type l -printf x -quit 2>/dev/null)"; then
            if [[ -n "$client_scan_symlink" ]]; then
              printf '%s\n' 'Client secret marker scan failed.'
              exit 1
            fi
          else
            client_scan_status=$?
            printf '%s\n' 'Client secret marker scan failed.'
            exit "$client_scan_status"
          fi
          if node tools/scan-dist-secrets.mjs dist/client >/dev/null 2>&1; then
            printf '%s\n' 'Client secret marker scan passed.'
          else
            client_scan_status=$?
            printf '%s\n' 'Client secret marker scan failed.'
            exit "$client_scan_status"
          fi
